<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookList</title>
    <link rel="stylesheet" href="styleCRUD.css">
</head>
<body>
    
<h1>Book List</h1>
<input type="text" id="search" placeholder="제목을 입력하세요">
<button type ="button" onclick="searchBooks()">검색</button>
<button type="button" onclick="getBooks()">전체목록</button>

<form id="input">
    <p>도서 제목 </p>
    <input type="text" id="titleInput" placeholder="도서 제목을 입력하세요" required>
    <p>저자</p>
    <input type="text" id="author" placeholder="작가를 입력하세요" required>
    <p>출판일</p>
    <input type="date" id="dateInput" required >
    <p>평점</p>
    <input type="radio" name="rating" value="1" required>1점
    <input type="radio" name="rating" value="2">2점 
    <input type="radio" name="rating" value="3">3점 
    <input type="radio" name="rating" value="4">4점 
    <input type="radio" name="rating" value="5">5점 
<button type="submit">추가하기</button>
</form>
<p id="message"></p>
<table>
    <thead>
        <tr><th>제목</th><th>저자</th><th>출판일</th><th>평점</th><th>관리</th></tr>
    </thead>
    <tbody id="bookList"></tbody>
</table>

<script src="CRUD.js"></script>
</body>


</html>
