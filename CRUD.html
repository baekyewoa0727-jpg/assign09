<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookList</title>
</head>
<body>
    
<h1>Book List</h1>

<!--

<form id="input">
    <p>도서 제목 </p>
    <input type="text" id="titleInput">
    <p>저자</p>
    <input type="text" id="author">
    <p>출판일</p>
    <input type="date" id="dateInput" >
    <p>평점</p>
    <input type="radio" name="rating" value="1">1점
    <input type="radio" name="rating" value="2">2점 
    <input type="radio" name="rating" value="3">3점 
    <input type="radio" name="rating" value="4">4점 
    <input type="radio" name="rating" value="5">5점 
</form>
<button>추가하기</button>

<table>
    <thead>
        <tr><th>제목</th><th>저자</th><th>출판일</th><th>평점</th></tr>
    </thead>
</table>

</body>

</html>
