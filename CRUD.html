<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    
<h1>Book List</h1>


<form id="search">
    <input type="text">
    <button id="searchbtn">검색하기</button>
</form>

<form id="input">
    <p>도서 제목 </p>
    <input type="text" id="titleInput">
    <p>저자</p>
    <input type="text" id="author">
    <p>출판일</p>
    <input type="date" id="dateInput" >
    <p>평점</p>
    <input type="radio" name="rating" value="1">1점
    <input type="radio" name="rating" value="2">2점 
    <input type="radio" name="rating" value="3">3점 
    <input type="radio" name="rating" value="4">4점 
    <input type="radio" name="rating" value="5">5점 
</form>
<button>추가하기</button>

<p>도서 목록</p>
</body>

<script>
async function loadStudents() {
    const response = await fetch("https://6ae1b574bbb541292299076b.mockapi.io/Book");

    if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
    }

    const students = await response.json();
    renderStudents(students);
}
</script>
