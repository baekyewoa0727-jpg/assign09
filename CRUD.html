<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookList</title>
</head>
<body>
    
<h1>Book List</h1>
<input type="text" id="search">
<button type ="button" onclick="searchBooks()">검색</button>
<butotn type="button" onclick="getBooks()">전체목록</butotn>

<form id="input">
    <p>도서 제목 </p>
    <input type="text" id="titleInput">
    <p>저자</p>
    <input type="text" id="author">
    <p>출판일</p>
    <input type="date" id="dateInput" >
    <p>평점</p>
    <input type="radio" name="rating" value="1">1점
    <input type="radio" name="rating" value="2">2점 
    <input type="radio" name="rating" value="3">3점 
    <input type="radio" name="rating" value="4">4점 
    <input type="radio" name="rating" value="5">5점 
<button>추가하기</button>
</form>

<table>
    <thead>
        <tr><th>제목</th><th>저자</th><th>출판일</th><th>평점</th></tr>
    </thead>
    <tbody id="BookList"></tbody>
</table>

</body>

</html>
